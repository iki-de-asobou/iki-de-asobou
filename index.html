<!doctype html>
<html lang="ja">

<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>すーっと！ はつおん</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap"
    rel="stylesheet"
>

<style>

:root {
    --bg: #DDF3FA;
    --blue: #0057D9;
    --bar-blue: #1677FF;
    --bar-red: #F04444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: #111;

    font-family:
        "Klee One",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;

    font-weight: 700;
}

button {
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;

    min-height: 50px;

    padding: 8px 15px;

    border: 1px solid #888;
    border-radius: 7px;

    background: #f7f7f7;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.main-layout {
    max-width: 1100px;

    margin: auto;
    padding: 20px;

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        210px;

    gap: 28px;
}

.main-left {
    text-align: center;
}

.title {
    display: flex;
    justify-content: center;
    align-items: baseline;
    flex-wrap: wrap;

    gap: 10px 16px;

    margin: 4px 0 16px;

    font-weight: 700;
    line-height: 1.2;
}

.title-main {
    color: var(--blue);

    font-size: 46px;
    letter-spacing: 0.04em;
}

.title-sub {
    color: #111;

    font-size: 30px;
    letter-spacing: 0.08em;
}

#status {
    min-height: 34px;

    font-size: 20px;
}

.image-box {
    width: min(100%, 650px);

    aspect-ratio: 10 / 7;

    margin: 10px auto;

    background: white;

    border: 1px solid #999;

    display: flex;

    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

.count {
    margin-top: 12px;

    font-size: 19px;
    font-weight: 600;
}

.side-buttons {
    padding-top: 50px;

    display: flex;

    flex-direction: column;

    gap: 15px;
}

.side-buttons button {
    font-size: 18px;
}

#displayModeButton {
    line-height: 1.4;
}


/* =========================================================
   トップページ 注意書き
========================================================= */

.trouble-note {
    margin: 18px 2px 0;

    font-size: 13px;
    font-weight: 600;
    line-height: 1.7;

    text-align: left;

    color: #555;
}


.page {
    max-width: 1000px;

    margin: auto;

    text-align: center;

    padding: 30px 18px;
}

.page h1 {
    font-size: 36px;
    font-weight: 600;

    margin: 5px 0 18px;
}

.description {
    font-size: 19px;
    font-weight: 600;

    line-height: 1.7;

    margin: 5px;
}


/* =========================================================
   母音後続
========================================================= */

.bar-area {
    position: relative;

    width: min(92vw, 900px);

    height: 250px;

    margin: 25px auto 5px;

    touch-action: none;

    user-select: none;
}

.bar-track {
    position: absolute;

    left: 0;
    right: 0;
    top: 80px;

    height: 90px;

    transform-origin: center center;

    transition: transform 0.18s ease;
}


/*
    鏡モード。

    棒も「いき」「こえ」の文字も
    全部まとめて左右反転する。
*/
.bar-track.mirror {
    transform: scaleX(-1);
}

.segment {
    position: absolute;

    height: 90px;

    top: 0;

    color: white;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: 600;

    overflow: hidden;
}

#blueSegment {
    background: var(--bar-blue);
}

#redSegment {
    background: var(--bar-red);
}

.bar-line {
    position: absolute;

    top: -18px;

    width: 5px;
    height: 126px;

    background: #333;

    transform: translateX(-2px);
}

.bar-line.middle {
    top: -22px;

    height: 134px;

    background: white;
}

.handle {
    position: absolute;

    top: 101px;

    width: 30px;
    height: 30px;

    min-height: 0;

    border-radius: 50%;

    border: 2px solid #333;

    background: white;

    transform: translateX(-15px);

    padding: 0;

    z-index: 10;
}

.vowel-controls {
    margin: 5px auto 15px;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;
}

.vowel-controls button {
    min-width: 210px;

    font-size: 16px;
}


/* =========================================================
   単語
========================================================= */

.word-box {
    cursor: pointer;

    touch-action: manipulation;
}

#wordPosition {
    min-height: 24px;

    color: #555;
}

/* 単語画像の鏡モード */
#wordImage {
    transform-origin: center center;
    transition: transform 0.18s ease;
}

#wordImage.mirror {
    transform: scaleX(-1);
}

.bottom-buttons {
    margin-top: 15px;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;
}

.bottom-buttons button {
    min-width: 145px;

    font-size: 16px;
}


.copyright {
    margin-top: 28px;
    text-align: center;
    font-size: 13px;
    color: #555;
}


/* =========================================================
   スマホ・iPad等
========================================================= */

@media (max-width: 760px) {

    .main-layout {
        grid-template-columns: 1fr;

        padding: 12px;
    }

    .side-buttons {
        padding-top: 5px;

        display: grid;

        grid-template-columns:
            1fr 1fr;

        gap: 10px;
    }

    #displayModeButton {
        grid-column: 1 / -1;
    }

    .trouble-note {
        grid-column: 1 / -1;

        margin-top: 8px;
        padding: 0 4px;

        font-size: 12px;
    }

    .title {
        gap: 6px 10px;
        margin-bottom: 12px;
    }

    .title-main {
        font-size: 34px;
    }

    .title-sub {
        font-size: 24px;
    }

    .page h1 {
        font-size: 30px;
    }

    .description {
        font-size: 17px;
    }
}

</style>

</head>


<body>

     メイン
========================================================= -->

    class="screen active"
>

<div class="main-layout">

<script>

"use strict";


// ============================================================
// 基本
// ============================================================

const MAX_MAIN_IMAGES = 10;
const MAX_WORD_IMAGES = 12;


// ============================================================
// 表示モード
// ============================================================

const DISPLAY_MODE_STORAGE_KEY =
    "IkiDeAsobouDisplayMode";


let displayMode =
    localStorage.getItem(
        DISPLAY_MODE_STORAGE_KEY
    );


if (
    displayMode !== "during"
    &&
    displayMode !== "untilNext"
) {

    displayMode =
        "during";

}


// ============================================================
// 母音後続 鏡モード
// ============================================================

const MIRROR_MODE_STORAGE_KEY =
    "IkiDeAsobouMirrorMode";


let mirrorMode =
    localStorage.getItem(
        MIRROR_MODE_STORAGE_KEY
    )
    ===
    "true";


// ============================================================
// 単語 鏡モード
// ============================================================

const WORD_MIRROR_MODE_STORAGE_KEY =
    "IkiDeAsobouWordMirrorMode";


let wordMirrorMode =
    localStorage.getItem(
        WORD_MIRROR_MODE_STORAGE_KEY
    )
    ===
    "true";


// ============================================================
// 共通 S開始判定
// ============================================================

const HIGH_RATIO_MIN =
    0.38;

const ZCR_MIN =
    0.025;

const PEAK_RATIO_LIMIT =
    4.5;

const PEAK_LIMIT =
    0.085;


const NORMAL_MIN_VOLUME =
    0.0045;

const NORMAL_REQUIRED =
    2;


const WEAK_MIN_VOLUME =
    0.0035;

const WEAK_REQUIRED =
    4;


const CALIBRATION_SECONDS =
    1.0;


// ============================================================
// 端末
// ============================================================

const USER_AGENT =
    navigator.userAgent || "";


const IS_ANDROID =
    /Android/i.test(
        USER_AGENT
    );


const IS_IOS =
    /iPad|iPhone|iPod/i.test(
        USER_AGENT
    )
    ||
    (
        navigator.maxTouchPoints > 1
        &&
        /Macintosh/i.test(
            USER_AGENT
        )
    )
    ||
    (
        navigator.platform === "MacIntel"
        &&
        navigator.maxTouchPoints > 1
    );


// ============================================================
// Android
// ============================================================

const ANDROID_HOLD_HIGH_RATIO_MIN =
    0.30;

const ANDROID_HOLD_ZCR_MIN =
    0.018;

const ANDROID_RELEASE_SECONDS =
    0.28;


// ============================================================
// PC
// ============================================================

const PC_HOLD_HIGH_RATIO_MIN =
    0.30;

const PC_HOLD_ZCR_MIN =
    0.017;

const PC_SOFT_RELEASE_SECONDS =
    0.50;

const PC_SILENCE_RELEASE_SECONDS =
    0.18;

const PC_ONSET_EXTRA_FRAMES =
    2;


// ============================================================
// iPad / iPhone
// ============================================================

const IOS_WEAK_MIN_VOLUME =
    0.0028;

const IOS_WEAK_REQUIRED =
    5;


const IOS_HOLD_HIGH_RATIO_MIN =
    0.28;

const IOS_HOLD_ZCR_MIN =
    0.015;


const IOS_REFERENCE_BUILD_SECONDS =
    0.25;

const IOS_RELEASE_RATIO =
    0.35;

const IOS_RELEASE_ABSOLUTE =
    0.0022;

const IOS_RELEASE_NOISE_MULTIPLIER =
    1.30;

const IOS_RELEASE_NOISE_ADD =
    0.00055;

const IOS_RELEASE_SECONDS =
    0.20;

const IOS_SPECTRAL_RELEASE_SECONDS =
    0.40;

const IOS_INITIAL_PROTECTION_SECONDS =
    0.30;


// ============================================================
// Watchdog
// ============================================================

const AUDIO_STALL_MS =
    1500;


// ============================================================
// DOM
// ============================================================

const mainScreen =
    document.getElementById(
        "mainScreen"
    );


const vowelScreen =
    document.getElementById(
        "vowelScreen"
    );


const wordScreen =
    document.getElementById(
        "wordScreen"
    );


const statusElement =
    document.getElementById(
        "status"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const displayModeButton =
    document.getElementById(
        "displayModeButton"
    );


const mainImage =
    document.getElementById(
        "mainImage"
    );


const mainCount =
    document.getElementById(
        "mainCount"
    );


const mainFileInput =
    document.getElementById(
        "mainFileInput"
    );


const wordImage =
    document.getElementById(
        "wordImage"
    );


const wordImageBox =
    document.getElementById(
        "wordImageBox"
    );


const wordCount =
    document.getElementById(
        "wordCount"
    );


const wordPosition =
    document.getElementById(
        "wordPosition"
    );


const wordFileInput =
    document.getElementById(
        "wordFileInput"
    );


const wordMirrorButton =
    document.getElementById(
        "wordMirrorButton"
    );


// ============================================================
// 表示モード
// ============================================================

function updateDisplayModeButton() {

    if (
        displayMode === "during"
    ) {

        displayModeButton.textContent =
            "表示モード：s音の間だけ";

    }

    else {

        displayModeButton.textContent =
            "表示モード：次のs音まで";

    }

}


displayModeButton.addEventListener(
    "click",
    function() {

        if (
            displayMode === "during"
        ) {

            displayMode =
                "untilNext";

        }

        else {

            displayMode =
                "during";

        }


        localStorage.setItem(
            DISPLAY_MODE_STORAGE_KEY,
            displayMode
        );


        updateDisplayModeButton();


        if (
            displayMode === "during"
            &&
            !soundLatched
        ) {

            clearImageElement(
                mainImage
            );

        }

    }
);


// ============================================================
// 画面
// ============================================================

function showScreen(target) {

    mainScreen.classList.remove(
        "active"
    );

    vowelScreen.classList.remove(
        "active"
    );

    wordScreen.classList.remove(
        "active"
    );


    target.classList.add(
        "active"
    );

}


// ============================================================
// IndexedDB
// ============================================================

const DB_NAME =
    "IkiDeAsobouDB";


const DB_VERSION =
    1;


const STORE_MAIN =
    "mainImages";


const STORE_WORD =
    "wordImages";


let database =
    null;


let mainImages =
    [];


let wordImages =
    [];


let wordIndex =
    0;


// ============================================================
// DB
// ============================================================

function openDatabase() {

    return new Promise(
        function(resolve, reject) {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function() {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames.contains(
                            STORE_MAIN
                        )
                    ) {

                        db.createObjectStore(
                            STORE_MAIN,
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }


                    if (
                        !db.objectStoreNames.contains(
                            STORE_WORD
                        )
                    ) {

                        db.createObjectStore(
                            STORE_WORD,
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                };


            request.onsuccess =
                function() {

                    database =
                        request.result;

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function getAllImages(
    storeName
) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readonly"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .getAll();


            request.onsuccess =
                function() {

                    resolve(
                        request.result || []
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function addImage(
    storeName,
    file
) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readwrite"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .add(
                        {
                            name:
                                file.name,

                            type:
                                file.type,

                            blob:
                                file,

                            createdAt:
                                Date.now()
                        }
                    );


            request.onsuccess =
                function() {

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function clearImages(
    storeName
) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readwrite"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .clear();


            request.onsuccess =
                function() {

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function reloadImages() {

    mainImages =
        (
            await getAllImages(
                STORE_MAIN
            )
        ).sort(
            function(a, b) {

                return a.id - b.id;

            }
        );


    wordImages =
        (
            await getAllImages(
                STORE_WORD
            )
        ).sort(
            function(a, b) {

                return a.id - b.id;

            }
        );


    mainCount.textContent =
        "登録画像："
        +
        mainImages.length
        +
        " / 10";


    wordCount.textContent =
        "登録画像："
        +
        wordImages.length
        +
        " / 12";

}


// ============================================================
// 画像
// ============================================================

function revokeImageURL(
    imageElement
) {

    const oldURL =
        imageElement.dataset.url;


    if (
        oldURL
    ) {

        URL.revokeObjectURL(
            oldURL
        );


        delete imageElement.dataset.url;

    }

}


function clearImageElement(
    imageElement
) {

    imageElement.style.visibility =
        "hidden";


    imageElement.style.opacity =
        "0";


    revokeImageURL(
        imageElement
    );


    imageElement.removeAttribute(
        "src"
    );

}


function displayBlob(
    imageElement,
    record
) {

    imageElement.style.visibility =
        "hidden";


    imageElement.style.opacity =
        "0";


    revokeImageURL(
        imageElement
    );


    const url =
        URL.createObjectURL(
            record.blob
        );


    imageElement.dataset.url =
        url;


    imageElement.onload =
        function() {

            imageElement.style.visibility =
                "visible";


            imageElement.style.opacity =
                "1";

        };


    imageElement.src =
        url;

}


function showRandomMainImage() {

    if (
        mainImages.length === 0
    ) {

        clearImageElement(
            mainImage
        );


        return;

    }


    const index =
        Math.floor(
            Math.random()
            *
            mainImages.length
        );


    displayBlob(
        mainImage,
        mainImages[index]
    );

}


// ============================================================
// 単語 鏡モード表示更新
// ============================================================

function updateWordMirrorMode() {

    if (
        wordMirrorMode
    ) {

        wordImage.classList.add(
            "mirror"
        );


        wordMirrorButton.textContent =
            "左右反転（鏡に映す）：ON";

// ============================================================
// バー最小幅
// ============================================================

function minimumBarWidth() {

    const width =
        Math.max(
            1,
            barTrack.clientWidth
        );


    return Math.max(
        20 / width,
        0.02
    );

}


// ============================================================
// 画面上のX座標を論理位置に変換
// ============================================================

function pointerRatio(
    clientX
) {

    const rect =
        barTrack.getBoundingClientRect();


    let ratio =
        (
            clientX
            -
            rect.left
        )
        /
        rect.width;


    ratio =
        Math.max(
            0,
            Math.min(
                1,
                ratio
            )
        );


    if (
        mirrorMode
    ) {

        ratio =
            1
            -
            ratio;

    }


    return ratio;

}


// ============================================================
// 最寄りハンドル
// ============================================================

function nearestHandle(
    clientX
) {

    const ratio =
        pointerRatio(
            clientX
        );


    const values =
        {

            left:
                Math.abs(
                    ratio
                    -
                    barLeft
                ),

            middle:
                Math.abs(
                    ratio
                    -
                    barMiddle
                ),

            right:
                Math.abs(
                    ratio
                    -
                    barRight
                )

        };


    return Object
        .entries(
            values
        )
        .sort(
            function(a, b) {

                return (
                    a[1]
                    -
                    b[1]
                );

            }
        )[0][0];

}


// ============================================================
// バー移動
// ============================================================

function moveBar(
    clientX
) {

    if (
        dragging === null
    ) {

        return;

    }


    let x =
        pointerRatio(
            clientX
        );


    x =
        Math.max(
            0.02,
            Math.min(
                0.98,
                x
            )
        );


    const minimum =
        minimumBarWidth();


    if (
        dragging === "left"
    ) {

        barLeft =
            Math.max(
                0.02,

                Math.min(
                    x,

                    barMiddle
                    -
                    minimum
                )
            );

    }


    else if (
        dragging === "middle"
    ) {

        barMiddle =
            Math.max(
                barLeft
                +
                minimum,

                Math.min(
                    x,

                    barRight
                    -
                    minimum
                )
            );

    }


    else if (
        dragging === "right"
    ) {

        barRight =
            Math.min(
                0.98,

                Math.max(
                    x,

                    barMiddle
                    +
                    minimum
                )
            );

    }


    drawBar();

}

// ============================================================
// RMS
// ============================================================

function calculateRMS(
    samples
) {

    let total =
        0;


    for (
        let i = 0;
        i < samples.length;
        i++
    ) {

        total +=
            samples[i]
            *
            samples[i];

    }


    return Math.sqrt(
        total
        /
        samples.length
    );

}


// ============================================================
// Peak
// ============================================================

function calculatePeak(
    samples
) {

    let peak =
        0;


    for (
        const value
        of samples
    ) {

        const absolute =
            Math.abs(
                value
            );


        if (
            absolute > peak
        ) {

            peak =
                absolute;

        }

    }


    return peak;

}


// ============================================================
// ZCR
// ============================================================

function calculateZCR(
    samples
) {

    let count =
        0;


    for (
        let i = 1;
        i < samples.length;
        i++
    ) {

        const before =
            samples[
                i - 1
            ];


        const now =
            samples[
                i
            ];


        if (
            (
                before < 0
                &&
                now >= 0
            )
            ||
            (
                before >= 0
                &&
                now < 0
            )
        ) {

            count++;

        }

    }


    return (
        count
        /
        samples.length
    );

}


// ============================================================
// FFT
// ============================================================

function nextPowerOfTwo(
    number
) {

    let value =
        1;


    while (
        value < number
    ) {

        value *=
            2;

    }


    return value;

}


function fftMagnitudes(
    samples
) {

    const size =
        nextPowerOfTwo(
            samples.length
        );


    const real =
        new Float64Array(
            size
        );


    const imaginary =
        new Float64Array(
            size
        );


    for (
        let i = 0;
        i < samples.length;
        i++
    ) {

        real[i] =
            samples[i];

    }


    let j =
        0;


    for (
        let i = 1;
        i < size;
        i++
    ) {

        let bit =
            size >> 1;


        while (
            j & bit
        ) {

            j ^=
                bit;


            bit >>=
                1;

        }


        j ^=
            bit;


        if (
            i < j
        ) {

            const tempReal =
                real[i];


            real[i] =
                real[j];


            real[j] =
                tempReal;


            const tempImag =
                imaginary[i];


            imaginary[i] =
                imaginary[j];


            imaginary[j] =
                tempImag;

        }

    }


    for (
        let length = 2;
        length <= size;
        length *= 2
    ) {

        const angle =
            -2
            *
            Math.PI
            /
            length;


        const baseCos =
            Math.cos(
                angle
            );


        const baseSin =
            Math.sin(
                angle
            );


        for (
            let i = 0;
            i < size;
            i += length
        ) {

            let wCos =
                1;


            let wSin =
                0;


            for (
                let k = 0;
                k < length / 2;
                k++
            ) {

                const firstReal =
                    real[
                        i + k
                    ];


                const firstImag =
                    imaginary[
                        i + k
                    ];


                const index2 =
                    i
                    +
                    k
                    +
                    length / 2;


                const secondReal =
                    real[
                        index2
                    ]
                    *
                    wCos
                    -
                    imaginary[
                        index2
                    ]
                    *
                    wSin;


                const secondImag =
                    real[
                        index2
                    ]
                    *
                    wSin
                    +
                    imaginary[
                        index2
                    ]
                    *
                    wCos;


                real[
                    i + k
                ] =
                    firstReal
                    +
                    secondReal;


                imaginary[
                    i + k
                ] =
                    firstImag
                    +
                    secondImag;


                real[
                    index2
                ] =
                    firstReal
                    -
                    secondReal;


                imaginary[
                    index2
                ] =
                    firstImag
                    -
                    secondImag;


                const nextCos =
                    wCos
                    *
                    baseCos
                    -
                    wSin
                    *
                    baseSin;


                const nextSin =
                    wCos
                    *
                    baseSin
                    +
                    wSin
                    *
                    baseCos;


                wCos =
                    nextCos;


                wSin =
                    nextSin;

            }

        }

    }


    const magnitudes =
        new Float64Array(
            size / 2 + 1
        );


    for (
        let i = 0;
        i < magnitudes.length;
        i++
    ) {

        magnitudes[i] =
            Math.hypot(
                real[i],
                imaginary[i]
            );

    }


    return {

        magnitudes:
            magnitudes,

        fftSize:
            size

    };

}


// ============================================================
// 分析
// ============================================================

function analyzeFrame(
    samples
) {

    const volume =
        calculateRMS(
            samples
        );


    const peak =
        calculatePeak(
            samples
        );


    const zcr =
        calculateZCR(
            samples
        );


    const fft =
        fftMagnitudes(
            samples
        );


    let total =
        0;


    let high =
        0;


    for (
        let i = 0;
        i < fft.magnitudes.length;
        i++
    ) {

        const magnitude =
            fft.magnitudes[i];


        total +=
            magnitude;


        const frequency =
            i
            *
            audioContext.sampleRate
            /
            fft.fftSize;


        if (
            frequency >= 3000
        ) {

            high +=
                magnitude;

        }

    }


    const highRatio =
        total > 0
        ?
        high / total
        :
        0;


    return {

        volume:
            volume,

        peak:
            peak,

        zcr:
            zcr,

        highRatio:
            highRatio

    };

}


// ============================================================
// S共通特徴
// ============================================================

function commonSFeatures(
    result
) {

    if (
        result.highRatio
        <
        HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr
        <
        ZCR_MIN
    ) {

        return false;

    }


    const peakRatio =
        result.volume > 0
        ?
        result.peak
        /
        result.volume
        :
        999;


    if (
        peakRatio
        >
        PEAK_RATIO_LIMIT
    ) {

        return false;

    }


    if (
        result.peak
        >
        PEAK_LIMIT
    ) {

        return false;

    }


    return true;

}


// ============================================================
// 通常S
// ============================================================

function normalS(
    result
) {

    if (
        result.volume
        <
        normalDynamicMin
    ) {

        return false;

    }


    return commonSFeatures(
        result
    );

}


// ============================================================
// 弱いS
// ============================================================

function weakS(
    result
) {

    if (
        result.volume
        <
        weakDynamicMin
    ) {

        return false;

    }


    return commonSFeatures(
        result
    );

}


// ============================================================
// iPad弱いS
// ============================================================

function weakSIOS(
    result
) {

    if (
        result.volume
        <
        iosWeakDynamicMin
    ) {

        return false;

    }


    return commonSFeatures(
        result
    );

}


// ============================================================
// PC追加確認
// ============================================================

function pcOnsetContinuation(
    result
) {

    const minimumVolume =
        Math.max(
            0.0027,
            noiseFloor * 1.15,
            noiseFloor + 0.0004
        );


    if (
        result.volume
        <
        minimumVolume
    ) {

        return false;

    }


    if (
        result.highRatio
        <
        0.32
    ) {

        return false;

    }


    if (
        result.zcr
        <
        0.018
    ) {

        return false;

    }


    const peakRatio =
        result.volume > 0
        ?
        result.peak
        /
        result.volume
        :
        999;


    if (
        peakRatio > 5.0
    ) {

        return false;

    }


    if (
        result.peak > 0.095
    ) {

        return false;

    }


    return true;

}

// Android継続
// ============================================================

function holdSAndroid(
    result
) {

    const minimumVolume =
        Math.max(
            WEAK_MIN_VOLUME * 0.70,
            noiseFloor * 1.20,
            noiseFloor + 0.0005
        );


    if (
        result.volume
        <
        minimumVolume
    ) {

        return false;

    }


    if (
        result.highRatio
        <
        ANDROID_HOLD_HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr
        <
        ANDROID_HOLD_ZCR_MIN
    ) {

        return false;

    }


    const peakRatio =
        result.volume > 0
        ?
        result.peak
        /
        result.volume
        :
        999;


    if (
        peakRatio > 6.0
    ) {

        return false;

    }


    if (
        result.peak > 0.11
    ) {

        return false;

    }


    return true;

}


// ============================================================
// PC継続
// ============================================================

function holdSPC(
    result
) {

    const minimumVolume =
        Math.max(
            noiseFloor * 1.15,
            noiseFloor + 0.0004,
            0.0022
        );


    if (
        result.volume
        <
        minimumVolume
    ) {

        return false;

    }


    if (
        result.highRatio
        <
        PC_HOLD_HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr
        <
        PC_HOLD_ZCR_MIN
    ) {

        return false;

    }


    return true;

}


function pcClearlySilent(
    result
) {

    const threshold =
        Math.max(
            0.0023,
            noiseFloor * 1.25,
            noiseFloor + 0.00055
        );


    return (
        result.volume
        <
        threshold
    );

}


// ============================================================
// iPad継続
// ============================================================

function holdSIOS(
    result
) {

    const minimumVolume =
        Math.max(
            0.0019,
            noiseFloor * 1.10,
            noiseFloor + 0.00030
        );


    if (
        result.volume
        <
        minimumVolume
    ) {

        return false;

    }


    if (
        result.highRatio
        <
        IOS_HOLD_HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr
        <
        IOS_HOLD_ZCR_MIN
    ) {

        return false;

    }


    return true;

}


// ============================================================
// iPad終了しきい値
// ============================================================

function iosReleaseVolumeThreshold() {

    const relativeThreshold =
        iosReferenceVolume
        *
        IOS_RELEASE_RATIO;


    const noiseThreshold =
        Math.max(
            IOS_RELEASE_ABSOLUTE,

            noiseFloor
            *
            IOS_RELEASE_NOISE_MULTIPLIER,

            noiseFloor
            +
            IOS_RELEASE_NOISE_ADD
        );


    return Math.max(
        relativeThreshold,
        noiseThreshold
    );

}


// ============================================================
// キャリブレーション
// ============================================================

function finishCalibration() {

    const values =
        [
            ...calibrationVolumes
        ].sort(
            function(a, b) {

                return a - b;

            }
        );


    if (
        values.length > 0
    ) {

        noiseFloor =
            values[
                Math.floor(
                    values.length / 2
                )
            ];

    }

    else {

        noiseFloor =
            0;

    }


    normalDynamicMin =
        Math.max(
            NORMAL_MIN_VOLUME,
            noiseFloor * 1.35,
            noiseFloor + 0.0015
        );


    normalDynamicMin =
        Math.min(
            normalDynamicMin,
            0.0100
        );


    weakDynamicMin =
        Math.max(
            WEAK_MIN_VOLUME,
            noiseFloor * 1.12,
            noiseFloor + 0.0005
        );


    weakDynamicMin =
        Math.max(
            weakDynamicMin,
            noiseFloor + 0.0004
        );


    weakDynamicMin =
        Math.min(
            weakDynamicMin,
            0.0065
        );


    iosWeakDynamicMin =
        Math.max(
            IOS_WEAK_MIN_VOLUME,
            noiseFloor * 1.08,
            noiseFloor + 0.00035
        );


    iosWeakDynamicMin =
        Math.min(
            iosWeakDynamicMin,
            0.0055
        );


    calibrating =
        false;


    statusElement.textContent =
        "";

}


// ============================================================
// S開始
// ============================================================

function latchS(
    result
) {

    soundLatched =
        true;


    normalCount =
        0;


    weakCount =
        0;


    iosWeakCount =
        0;


    releaseCount =
        0;


    silenceCount =
        0;


    pcPendingOnset =
        false;


    pcOnsetConfirmCount =
        0;


    iosReferenceVolume =
        result.volume;


    iosActiveFrameCount =
        0;


    showRandomMainImage();

}


// ============================================================
// 音声判定
// ============================================================

function processResult(
    result
) {

    if (
        calibrating
    ) {

        calibrationVolumes.push(
            result.volume
        );


        if (
            calibrationVolumes.length
            >=
            calibrationFramesNeeded
        ) {

            finishCalibration();

        }


        return;

    }


    // ========================================================
    // S未検出
    // ========================================================

    if (
        !soundLatched
    ) {

        if (
            !IS_ANDROID
            &&
            !IS_IOS
            &&
            pcPendingOnset
        ) {

            if (
                pcOnsetContinuation(
                    result
                )
            ) {

                pcOnsetConfirmCount++;


                if (
                    pcOnsetConfirmCount
                    >=
                    PC_ONSET_EXTRA_FRAMES
                ) {

                    latchS(
                        result
                    );

                }

            }

            else {

                pcPendingOnset =
                    false;


                pcOnsetConfirmCount =
                    0;


                normalCount =
                    0;


                weakCount =
                    0;

            }


            return;

        }


        const normalCandidate =
            normalS(
                result
            );


        const weakCandidate =
            weakS(
                result
            );


        if (
            normalCandidate
        ) {

            normalCount++;

        }

        else {

            normalCount =
                0;

        }


        if (
            weakCandidate
        ) {

            weakCount++;

        }

        else {

            weakCount =
                0;

        }


        if (
            IS_IOS
        ) {

            if (
                weakSIOS(
                    result
                )
            ) {

                iosWeakCount++;

            }

            else {

                iosWeakCount =
                    0;

            }

        }

        else {

            iosWeakCount =
                0;

        }


        const normalSuccess =
            normalCount
            >=
            NORMAL_REQUIRED;


        const weakSuccess =
            weakCount
            >=
            WEAK_REQUIRED;


        const iosWeakSuccess =
            IS_IOS
            &&
            iosWeakCount
            >=
            IOS_WEAK_REQUIRED;


        if (
            normalSuccess
            ||
            weakSuccess
            ||
            iosWeakSuccess
        ) {

            if (
                !IS_ANDROID
                &&
                !IS_IOS
            ) {

                pcPendingOnset =
                    true;


                pcOnsetConfirmCount =
                    0;


                return;

            }


            latchS(
                result
            );

        }


        return;

    }


    // ========================================================
    // Android
    // ========================================================

    if (
        IS_ANDROID
    ) {

        if (
            holdSAndroid(
                result
            )
        ) {

            releaseCount =
                0;


            return;

        }


        releaseCount++;


        if (
            releaseCount
            >=
            androidReleaseFramesNeeded
        ) {

            finishCurrentS();

        }


        return;

    }


    // ========================================================
    // iPad / iPhone
    // ========================================================

    if (
        IS_IOS
    ) {

        iosActiveFrameCount++;


        if (
            iosActiveFrameCount
            <=
            iosReferenceBuildFramesNeeded
        ) {

            if (
                result.volume
                >
                iosReferenceVolume
            ) {

                iosReferenceVolume =
                    result.volume;

            }

        }


        if (
            iosActiveFrameCount
            <=
            iosInitialProtectionFramesNeeded
        ) {

            return;

        }


        const releaseVolume =
            iosReleaseVolumeThreshold();


        if (
            result.volume
            <
            releaseVolume
        ) {

            silenceCount++;

        }

        else {

            silenceCount =
                0;

        }


        if (
            silenceCount
            >=
            iosReleaseFramesNeeded
        ) {

            finishCurrentS();


            return;

        }


        if (
            holdSIOS(
                result
            )
        ) {

            releaseCount =
                0;

        }

        else {

            releaseCount++;

        }


        if (
            releaseCount
            >=
            iosSpectralReleaseFramesNeeded
        ) {

            finishCurrentS();

        }


        return;

    }


    // ========================================================
    // PC
    // ========================================================

    if (
        pcClearlySilent(
            result
        )
    ) {

        silenceCount++;

    }

    else {

        silenceCount =
            0;

    }


    if (
        silenceCount
        >=
        pcSilenceFramesNeeded
    ) {

        finishCurrentS();


        return;

    }


    if (
        holdSPC(
            result
        )
    ) {

        releaseCount =
            0;


        return;

    }


    releaseCount++;


    if (
        releaseCount
        >=
        pcSoftReleaseFramesNeeded
    ) {

        finishCurrentS();

    }

}


// ============================================================
// サンプル処理
// ============================================================

function addSamples(
    input
) {

    for (
        let i = 0;
        i < input.length;
        i++
    ) {

        sampleQueue.push(
            input[i]
        );

    }


    while (
        sampleQueue.length
        -
        queueOffset
        >=
        frameSize
    ) {

        const frame =
            new Float32Array(
                frameSize
            );


        for (
            let i = 0;
            i < frameSize;
            i++
        ) {

            frame[i] =
                sampleQueue[
                    queueOffset
                    +
                    i
                ];

        }


        queueOffset +=
            frameSize;


        const result =
            analyzeFrame(
                frame
            );


        processResult(
            result
        );

    }


    if (
        queueOffset > 8192
    ) {

        sampleQueue =
            sampleQueue.slice(
                queueOffset
            );


        queueOffset =
            0;

    }

}


// ============================================================
// Audio Graph
// ============================================================

function disconnectAudioGraph() {

    try {

        if (
            processorNode
        ) {

            processorNode.onaudioprocess =
                null;


            processorNode.disconnect();

        }

    }

    catch (error) {}


    try {

        if (
            sourceNode
        ) {

            sourceNode.disconnect();

        }

    }

    catch (error) {}


    try {

        if (
            muteNode
        ) {

            muteNode.disconnect();

        }

    }

    catch (error) {}


    processorNode =
        null;


    sourceNode =
        null;


    muteNode =
        null;

}


function buildAudioGraph() {

    disconnectAudioGraph();


    sourceNode =
        audioContext
            .createMediaStreamSource(
                mediaStream
            );


    processorNode =
        audioContext
            .createScriptProcessor(
                1024,
                1,
                1
            );


    processorNode.onaudioprocess =
        function(event) {

            lastAudioCallbackTime =
                performance.now();


            const input =
                event
                    .inputBuffer
                    .getChannelData(
                        0
                    );


            addSamples(
                input
            );

        };


    muteNode =
        audioContext
            .createGain();


    muteNode.gain.value =
        0;


    sourceNode.connect(
        processorNode
    );


    processorNode.connect(
        muteNode
    );


    muteNode.connect(
        audioContext.destination
    );


    lastAudioCallbackTime =
        performance.now();

}


// ============================================================
// Audio復旧
// ============================================================

async function rebuildAudioGraph() {

    if (
        rebuildingGraph
    ) {

        return;

    }


    if (
        !audioContext
        ||
        !mediaStream
    ) {

        return;

    }


    rebuildingGraph =
        true;


    resetRecognitionState(
        true
    );


    sampleQueue =
        [];


    queueOffset =
        0;


    try {

        if (
            audioContext.state
            ===
            "suspended"
        ) {

            try {

                await audioContext.resume();

            }

            catch (error) {}

        }


        buildAudioGraph();

    }

    catch (error) {

        console.error(
            error
        );

    }


    rebuildingGraph =
        false;

}


// ============================================================
// Watchdog
// ============================================================

function startWatchdog() {

    if (
        watchdogTimer
    ) {

        clearInterval(
            watchdogTimer
        );

    }


    watchdogTimer =
        setInterval(
            async function() {

                if (
                    !audioContext
                    ||
                    !mediaStream
                ) {

                    return;

                }


                if (
                    audioContext.state
                    ===
                    "suspended"
                ) {

                    try {

                        await audioContext.resume();

                    }

                    catch (error) {}

                }


                const elapsed =
                    performance.now()
                    -
                    lastAudioCallbackTime;


                if (
                    elapsed
                    >
                    AUDIO_STALL_MS
                ) {

                    await rebuildAudioGraph();

                }

            },
            500
        );

}


// ============================================================
// 前面復帰
// ============================================================

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState
            !==
            "visible"
        ) {

            return;

        }


        if (
            !audioContext
        ) {

            return;

        }


        try {

            if (
                audioContext.state
                ===
                "suspended"
            ) {

                await audioContext.resume();

            }

        }

        catch (error) {}


        resetRecognitionState(
            true
        );

    }
);


// ============================================================
// マイク停止
// ============================================================

function stopExistingMicrophone() {

    if (
        watchdogTimer
    ) {

        clearInterval(
            watchdogTimer
        );


        watchdogTimer =
            null;

    }


    disconnectAudioGraph();


    try {

        if (
            mediaStream
        ) {

            mediaStream
                .getTracks()
                .forEach(
                    function(track) {

                        track.stop();

                    }
                );


            mediaStream =
                null;

        }

    }

    catch (error) {}


    try {

        if (
            audioContext
        ) {

            audioContext.close();


            audioContext =
                null;

        }

    }

    catch (error) {}

}


// ============================================================
// マイク制約
// ============================================================

function createAudioConstraints() {

    const constraints =
        {};


    let supported =
        {};


    try {

        supported =
            navigator
                .mediaDevices
                .getSupportedConstraints
            ?
            navigator
                .mediaDevices
                .getSupportedConstraints()
            :
            {};

    }

    catch (error) {

        supported =
            {};

    }


    if (
        IS_IOS
    ) {

        if (
            supported.echoCancellation
        ) {

            constraints.echoCancellation =
                false;

        }


        if (
            supported.noiseSuppression
        ) {

            constraints.noiseSuppression =
                false;

        }


        if (
            supported.autoGainControl
        ) {

            constraints.autoGainControl =
                false;

        }


        if (
            supported.channelCount
        ) {

            constraints.channelCount =
                1;

        }

    }


    if (
        Object.keys(
            constraints
        ).length === 0
    ) {

        return true;

    }


    return constraints;

}


// ============================================================
// マイク開始
// ============================================================

async function startMicrophone() {

    if (
        !window.isSecureContext
    ) {

        alert(
            "HTTPS接続ではないためマイクを使用できません。"
        );


        return;

    }


    if (
        !navigator.mediaDevices
        ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "このブラウザではマイク機能を利用できません。"
        );


        return;

    }


    stopExistingMicrophone();


    statusElement.textContent =
        "ちょっとだけ　しずかにしてね…";


    resetRecognitionState(
        true
    );


    calibrationVolumes =
        [];


    calibrating =
        true;


    normalDynamicMin =
        NORMAL_MIN_VOLUME;


    weakDynamicMin =
        WEAK_MIN_VOLUME;


    iosWeakDynamicMin =
        IOS_WEAK_MIN_VOLUME;


    try {

        const audioConstraints =
            createAudioConstraints();


        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    {

                        audio:
                            audioConstraints,

                        video:
                            false

                    }
                );


        const AudioContextClass =
            window.AudioContext
            ||
            window.webkitAudioContext;


        audioContext =
            new AudioContextClass();


        if (
            audioContext.state
            ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        frameSize =
            Math.max(
                256,

                Math.round(
                    audioContext.sampleRate
                    *
                    (
                        735
                        /
                        44100
                    )
                )
            );


        calibrationFramesNeeded =
            Math.max(
                1,

                Math.round(
                    CALIBRATION_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        androidReleaseFramesNeeded =
            Math.max(
                1,

                Math.round(
                    ANDROID_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        pcSoftReleaseFramesNeeded =
            Math.max(
                1,

                Math.round(
                    PC_SOFT_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        pcSilenceFramesNeeded =
            Math.max(
                1,

                Math.round(
                    PC_SILENCE_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        iosReferenceBuildFramesNeeded =
            Math.max(
                1,

                Math.round(
                    IOS_REFERENCE_BUILD_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        iosReleaseFramesNeeded =
            Math.max(
                1,

                Math.round(
                    IOS_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        iosSpectralReleaseFramesNeeded =
            Math.max(
                1,

                Math.round(
                    IOS_SPECTRAL_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        iosInitialProtectionFramesNeeded =
            Math.max(
                1,

                Math.round(
                    IOS_INITIAL_PROTECTION_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        sampleQueue =
            [];


        queueOffset =
            0;


        buildAudioGraph();


        startWatchdog();


        startButton.disabled =
            false;


        startButton.textContent =
            "再スタート";

    }

    catch (error) {

        console.error(
            error
        );


        statusElement.textContent =
            "";


        startButton.disabled =
            false;


        startButton.textContent =
            "スタート";


        alert(
            "マイクを開始できませんでした。"
        );

    }

}


// ============================================================
// スタート
// ============================================================

startButton.addEventListener(
    "click",
    startMicrophone
);


// ============================================================
// 起動
// ============================================================

async function initialize() {

    try {

        updateDisplayModeButton();


        updateMirrorMode();


        updateWordMirrorMode();


        await openDatabase();


        await reloadImages();


        clearImageElement(
            mainImage
        );


        showWordImage();


        drawBar();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "画像保存機能を開始できませんでした。"
        );

    }

}


initialize();

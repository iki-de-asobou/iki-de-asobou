<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>いきで　あそぼう！</title>


<style>

:root {
    --bg: #DDF3FA;
    --blue: #0057D9;
    --bar-blue: #1677FF;
    --bar-red: #F04444;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: #111;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        "Meiryo",
        sans-serif;
}

button {
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    min-height: 50px;
    padding: 8px 15px;
    border: 1px solid #888;
    border-radius: 7px;
    background: #f7f7f7;
}

button:disabled {
    opacity: 0.55;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}


/* ==========================================================
   メイン画面
========================================================== */

.main-layout {
    max-width: 1100px;
    margin: auto;
    padding: 20px;

    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        210px;

    gap: 28px;
}

.main-left {
    text-align: center;
}

.title {
    display: flex;
    justify-content: center;
    align-items: baseline;
    flex-wrap: wrap;

    margin: 5px 0 15px;

    font-size: 34px;
    font-weight: bold;
}

.title-s {
    color: var(--blue);
    margin-left: 24px;
    font-size: 37px;
}

#status {
    min-height: 34px;
    font-size: 20px;
}

.image-box {
    width: min(100%, 650px);
    aspect-ratio: 10 / 7;

    margin: 10px auto;

    background: white;
    border: 1px solid #999;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.image-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.count {
    margin-top: 12px;
    font-size: 19px;
    font-weight: bold;
}

.side-buttons {
    padding-top: 50px;

    display: flex;
    flex-direction: column;

    gap: 15px;
}

.side-buttons button {
    font-size: 18px;
}


/* ==========================================================
   共通サブ画面
========================================================== */

.page {
    max-width: 1000px;
    margin: auto;

    text-align: center;

    padding: 30px 18px;
}

.page h1 {
    font-size: 36px;
    margin: 5px 0 18px;
}

.description {
    font-size: 19px;
    line-height: 1.7;
    margin: 5px;
}


/* ==========================================================
   母音後続
========================================================== */

.bar-area {
    position: relative;

    width: min(92vw, 900px);
    height: 250px;

    margin: 25px auto 5px;

    touch-action: none;
    user-select: none;
}

.bar-track {
    position: absolute;

    left: 0;
    right: 0;
    top: 80px;

    height: 90px;
}

.segment {
    position: absolute;

    height: 90px;
    top: 0;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;
    font-weight: bold;

    overflow: hidden;
}

#blueSegment {
    background: var(--bar-blue);
}

#redSegment {
    background: var(--bar-red);
}

.bar-line {
    position: absolute;

    top: -18px;

    width: 5px;
    height: 126px;

    background: #333;

    transform: translateX(-2px);
}

.bar-line.middle {
    top: -22px;
    height: 134px;
    background: white;
}

.handle {
    position: absolute;

    top: 101px;

    width: 30px;
    height: 30px;

    min-height: 0;

    border-radius: 50%;
    border: 2px solid #333;

    background: white;

    transform: translateX(-15px);

    padding: 0;

    z-index: 10;
}


/* ==========================================================
   単語
========================================================== */

.word-box {
    cursor: pointer;
    touch-action: manipulation;
}

#wordPosition {
    min-height: 24px;
    color: #555;
}


/* ==========================================================
   下ボタン
========================================================== */

.bottom-buttons {
    margin-top: 15px;

    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 12px;
}

.bottom-buttons button {
    min-width: 145px;
    font-size: 16px;
}


/* ==========================================================
   スマホ・タブレット
========================================================== */

@media (max-width: 760px) {

    .main-layout {
        grid-template-columns: 1fr;
        padding: 12px;
    }

    .side-buttons {
        padding-top: 5px;

        display: grid;
        grid-template-columns:
            1fr
            1fr;

        gap: 10px;
    }

    .side-buttons button:last-child {
        grid-column: 1 / -1;
    }

    .title {
        font-size: 26px;
    }

    .title-s {
        margin-left: 10px;
        font-size: 29px;
    }

    .page h1 {
        font-size: 30px;
    }

    .description {
        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     メイン画面
======================================================== -->

<section
    id="mainScreen"
    class="screen active"
>

<div class="main-layout">

<div class="main-left">

<div class="title">

<span>
いきで　あそぼう！
</span>

<span class="title-s">
すー　すー　すー
</span>

</div>


<div id="status"></div>


<div class="image-box">

<img
    id="mainImage"
    alt=""
>

</div>


<div
    id="mainCount"
    class="count"
>
登録画像：0 / 10
</div>


</div>


<div class="side-buttons">

<button id="startButton">
スタート
</button>

<button id="registerMainButton">
画像を登録
</button>

<button id="clearMainButton">
画像をクリア
</button>

<button id="vowelButton">
母音後続
</button>

<button id="wordButton">
単語
</button>

</div>

</div>

</section>



<!-- ========================================================
     母音後続
======================================================== -->

<section
    id="vowelScreen"
    class="screen"
>

<div class="page">

<h1>
母音後続
</h1>


<p class="description">
棒の左端・青と赤の境目・右端を動かせます。
</p>


<p class="description">
息と声をつなげ、音節（さしすせそ）の練習をしましょう。
</p>


<div
    id="barArea"
    class="bar-area"
>

<div class="bar-track">

<div
    id="blueSegment"
    class="segment"
>
いき
</div>

<div
    id="redSegment"
    class="segment"
>
こえ
</div>

<div
    id="leftLine"
    class="bar-line"
></div>

<div
    id="middleLine"
    class="bar-line middle"
></div>

<div
    id="rightLine"
    class="bar-line"
></div>

<button
    id="leftHandle"
    class="handle"
    aria-label="左端"
></button>

<button
    id="middleHandle"
    class="handle"
    aria-label="青と赤の境目"
></button>

<button
    id="rightHandle"
    class="handle"
    aria-label="右端"
></button>

</div>

</div>


<div class="bottom-buttons">

<button id="vowelBackButton">
もどる
</button>

</div>

</div>

</section>



<!-- ========================================================
     単語
======================================================== -->

<section
    id="wordScreen"
    class="screen"
>

<div class="page">

<h1>
単語
</h1>


<p class="description">

「さしすせそ」を含む単語のイラストや写真を登録してください。

<br>

クリックまたはタップすると順番に表示されます。

</p>


<div
    id="wordImageBox"
    class="image-box word-box"
    tabindex="0"
>

<img
    id="wordImage"
    alt=""
>

</div>


<div
    id="wordCount"
    class="count"
>
登録画像：0 / 12
</div>


<div id="wordPosition"></div>


<div class="bottom-buttons">

<button id="registerWordButton">
画像を登録
</button>

<button id="clearWordButton">
画像をクリア
</button>

<button id="wordBackButton">
もどる
</button>

</div>

</div>

</section>



<input
    id="mainFileInput"
    type="file"
    accept="image/*"
    multiple
    hidden
>


<input
    id="wordFileInput"
    type="file"
    accept="image/*"
    multiple
    hidden
>



<script>

"use strict";


// ============================================================
// 基本設定
// ============================================================

const MAX_MAIN_IMAGES = 10;
const MAX_WORD_IMAGES = 12;


// ============================================================
// S開始判定
// ここは今まで一番良かった値を維持
// ============================================================

const HIGH_RATIO_MIN = 0.38;
const ZCR_MIN = 0.025;
const PEAK_RATIO_LIMIT = 4.5;
const PEAK_LIMIT = 0.085;

const NORMAL_MIN_VOLUME = 0.0045;
const NORMAL_REQUIRED = 2;

const WEAK_MIN_VOLUME = 0.0035;
const WEAK_REQUIRED = 4;

const CALIBRATION_SECONDS = 1.0;


/*
    ==========================================================
    S継続判定
    ==========================================================

    AndroidではS音を伸ばしていても、
    途中で音量・高周波比が揺れることがある。

    そのため、画像表示中は開始判定より少し緩くする。
*/


// 継続中は開始判定より高周波条件を少し緩める
const HOLD_HIGH_RATIO_MIN = 0.30;


// 継続中のZCRも少し緩める
const HOLD_ZCR_MIN = 0.018;


// Sが一時的に途切れても、これだけ待ってから消す
const S_RELEASE_SECONDS = 0.28;


// 無音にかなり近づいた場合は終了しやすくする
const RELEASE_NOISE_MULTIPLIER = 1.20;
const RELEASE_NOISE_ADD = 0.0005;


// ============================================================
// 画面
// ============================================================

const mainScreen =
    document.getElementById(
        "mainScreen"
    );

const vowelScreen =
    document.getElementById(
        "vowelScreen"
    );

const wordScreen =
    document.getElementById(
        "wordScreen"
    );


function showScreen(target) {

    mainScreen.classList.remove("active");
    vowelScreen.classList.remove("active");
    wordScreen.classList.remove("active");

    target.classList.add("active");

}


// ============================================================
// DOM
// ============================================================

const statusElement =
    document.getElementById(
        "status"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const mainImage =
    document.getElementById(
        "mainImage"
    );

const mainCount =
    document.getElementById(
        "mainCount"
    );

const mainFileInput =
    document.getElementById(
        "mainFileInput"
    );

const wordImage =
    document.getElementById(
        "wordImage"
    );

const wordImageBox =
    document.getElementById(
        "wordImageBox"
    );

const wordCount =
    document.getElementById(
        "wordCount"
    );

const wordPosition =
    document.getElementById(
        "wordPosition"
    );

const wordFileInput =
    document.getElementById(
        "wordFileInput"
    );


// ============================================================
// IndexedDB
// ============================================================

const DB_NAME = "IkiDeAsobouDB";
const DB_VERSION = 1;

const STORE_MAIN = "mainImages";
const STORE_WORD = "wordImages";

let database = null;

let mainImages = [];
let wordImages = [];

let wordIndex = 0;


function openDatabase() {

    return new Promise(
        function(resolve, reject) {

            const request =
                indexedDB.open(
                    DB_NAME,
                    DB_VERSION
                );


            request.onupgradeneeded =
                function() {

                    const db =
                        request.result;


                    if (
                        !db.objectStoreNames.contains(
                            STORE_MAIN
                        )
                    ) {

                        db.createObjectStore(
                            STORE_MAIN,
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }


                    if (
                        !db.objectStoreNames.contains(
                            STORE_WORD
                        )
                    ) {

                        db.createObjectStore(
                            STORE_WORD,
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                };


            request.onsuccess =
                function() {

                    database =
                        request.result;

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function getAllImages(storeName) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readonly"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .getAll();


            request.onsuccess =
                function() {

                    resolve(
                        request.result || []
                    );

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function addImage(storeName, file) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readwrite"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .add(
                        {
                            name:
                                file.name,

                            type:
                                file.type,

                            blob:
                                file,

                            createdAt:
                                Date.now()
                        }
                    );


            request.onsuccess =
                function() {

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function clearImages(storeName) {

    return new Promise(
        function(resolve, reject) {

            const transaction =
                database.transaction(
                    storeName,
                    "readwrite"
                );


            const request =
                transaction
                    .objectStore(
                        storeName
                    )
                    .clear();


            request.onsuccess =
                function() {

                    resolve();

                };


            request.onerror =
                function() {

                    reject(
                        request.error
                    );

                };

        }
    );

}


async function reloadImages() {

    mainImages =
        (
            await getAllImages(
                STORE_MAIN
            )
        ).sort(
            function(a, b) {

                return a.id - b.id;

            }
        );


    wordImages =
        (
            await getAllImages(
                STORE_WORD
            )
        ).sort(
            function(a, b) {

                return a.id - b.id;

            }
        );


    mainCount.textContent =
        "登録画像："
        +
        mainImages.length
        +
        " / 10";


    wordCount.textContent =
        "登録画像："
        +
        wordImages.length
        +
        " / 12";

}


// ============================================================
// 画像
// ============================================================

function revokeImageURL(imageElement) {

    const oldURL =
        imageElement.dataset.url;


    if (oldURL) {

        URL.revokeObjectURL(
            oldURL
        );


        delete imageElement.dataset.url;

    }

}


function clearImageElement(imageElement) {

    revokeImageURL(
        imageElement
    );


    imageElement.removeAttribute(
        "src"
    );

}


function displayBlob(imageElement, record) {

    revokeImageURL(
        imageElement
    );


    const url =
        URL.createObjectURL(
            record.blob
        );


    imageElement.dataset.url =
        url;


    imageElement.src =
        url;

}


function showRandomMainImage() {

    if (
        mainImages.length === 0
    ) {

        clearImageElement(
            mainImage
        );


        return;

    }


    const index =
        Math.floor(
            Math.random()
            *
            mainImages.length
        );


    displayBlob(
        mainImage,
        mainImages[index]
    );

}


// ============================================================
// 単語
// ============================================================

function showWordImage() {

    if (
        wordImages.length === 0
    ) {

        clearImageElement(
            wordImage
        );


        wordPosition.textContent =
            "";


        return;

    }


    if (
        wordIndex >=
        wordImages.length
    ) {

        wordIndex = 0;

    }


    displayBlob(
        wordImage,
        wordImages[wordIndex]
    );


    wordPosition.textContent =
        (wordIndex + 1)
        +
        " / "
        +
        wordImages.length;

}


function nextWordImage() {

    if (
        wordImages.length === 0
    ) {

        return;

    }


    wordIndex++;


    if (
        wordIndex >=
        wordImages.length
    ) {

        wordIndex = 0;

    }


    showWordImage();

}


// ============================================================
// メイン画像登録
// ============================================================

document
    .getElementById(
        "registerMainButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                mainImages.length >=
                MAX_MAIN_IMAGES
            ) {

                alert(
                    "画像は10枚まで登録できます。"
                );


                return;

            }


            mainFileInput.value =
                "";


            mainFileInput.click();

        }
    );


mainFileInput.addEventListener(
    "change",
    async function() {

        const remaining =
            MAX_MAIN_IMAGES
            -
            mainImages.length;


        const files =
            Array.from(
                mainFileInput.files
            ).slice(
                0,
                remaining
            );


        let added = 0;


        for (
            const file
            of files
        ) {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                continue;

            }


            await addImage(
                STORE_MAIN,
                file
            );


            added++;

        }


        await reloadImages();


        if (
            added > 0
        ) {

            alert(
                added
                +
                "枚の画像を登録しました。"
            );

        }

    }
);


document
    .getElementById(
        "clearMainButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (
                mainImages.length === 0
            ) {

                return;

            }


            if (
                !confirm(
                    "登録した画像をすべて削除しますか？"
                )
            ) {

                return;

            }


            await clearImages(
                STORE_MAIN
            );


            await reloadImages();


            clearImageElement(
                mainImage
            );

        }
    );


// ============================================================
// 単語画像登録
// ============================================================

document
    .getElementById(
        "registerWordButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                wordImages.length >=
                MAX_WORD_IMAGES
            ) {

                alert(
                    "画像は12枚まで登録できます。"
                );


                return;

            }


            wordFileInput.value =
                "";


            wordFileInput.click();

        }
    );


wordFileInput.addEventListener(
    "change",
    async function() {

        const remaining =
            MAX_WORD_IMAGES
            -
            wordImages.length;


        const files =
            Array.from(
                wordFileInput.files
            ).slice(
                0,
                remaining
            );


        const wasEmpty =
            wordImages.length === 0;


        for (
            const file
            of files
        ) {

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                continue;

            }


            await addImage(
                STORE_WORD,
                file
            );

        }


        await reloadImages();


        if (
            wasEmpty
            &&
            wordImages.length > 0
        ) {

            wordIndex = 0;

        }


        showWordImage();

    }
);


document
    .getElementById(
        "clearWordButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (
                wordImages.length === 0
            ) {

                return;

            }


            if (
                !confirm(
                    "登録した単語画像をすべて削除しますか？"
                )
            ) {

                return;

            }


            await clearImages(
                STORE_WORD
            );


            wordIndex = 0;


            await reloadImages();


            showWordImage();

        }
    );


wordImageBox.addEventListener(
    "click",
    nextWordImage
);


// ============================================================
// 画面切替
// ============================================================

document
    .getElementById(
        "vowelButton"
    )
    .addEventListener(
        "click",
        function() {

            showScreen(
                vowelScreen
            );


            requestAnimationFrame(
                drawBar
            );

        }
    );


document
    .getElementById(
        "wordButton"
    )
    .addEventListener(
        "click",
        function() {

            wordIndex = 0;


            showWordImage();


            showScreen(
                wordScreen
            );

        }
    );


document
    .getElementById(
        "vowelBackButton"
    )
    .addEventListener(
        "click",
        function() {

            showScreen(
                mainScreen
            );

        }
    );


document
    .getElementById(
        "wordBackButton"
    )
    .addEventListener(
        "click",
        function() {

            showScreen(
                mainScreen
            );

        }
    );


// ============================================================
// 母音後続バー
// ============================================================

const barArea =
    document.getElementById(
        "barArea"
    );

const blueSegment =
    document.getElementById(
        "blueSegment"
    );

const redSegment =
    document.getElementById(
        "redSegment"
    );

const leftLine =
    document.getElementById(
        "leftLine"
    );

const middleLine =
    document.getElementById(
        "middleLine"
    );

const rightLine =
    document.getElementById(
        "rightLine"
    );

const leftHandle =
    document.getElementById(
        "leftHandle"
    );

const middleHandle =
    document.getElementById(
        "middleHandle"
    );

const rightHandle =
    document.getElementById(
        "rightHandle"
    );


let barLeft = 0.15;
let barMiddle = 0.50;
let barRight = 0.85;

let dragging = null;


function drawBar() {

    const track =
        document.querySelector(
            ".bar-track"
        );


    const width =
        track.clientWidth;


    const left =
        barLeft
        *
        width;


    const middle =
        barMiddle
        *
        width;


    const right =
        barRight
        *
        width;


    blueSegment.style.left =
        left + "px";


    blueSegment.style.width =
        (middle - left)
        +
        "px";


    redSegment.style.left =
        middle + "px";


    redSegment.style.width =
        (right - middle)
        +
        "px";


    leftLine.style.left =
        left + "px";


    middleLine.style.left =
        middle + "px";


    rightLine.style.left =
        right + "px";


    leftHandle.style.left =
        left + "px";


    middleHandle.style.left =
        middle + "px";


    rightHandle.style.left =
        right + "px";


    blueSegment.textContent =
        (
            middle - left > 70
        )
        ?
        "いき"
        :
        "";


    redSegment.textContent =
        (
            right - middle > 70
        )
        ?
        "こえ"
        :
        "";

}


function minimumBarWidth() {

    const width =
        Math.max(
            1,
            barArea.clientWidth
        );


    return Math.max(
        20 / width,
        0.02
    );

}


function nearestHandle(clientX) {

    const track =
        document.querySelector(
            ".bar-track"
        );


    const rect =
        track.getBoundingClientRect();


    const x =
        clientX
        -
        rect.left;


    const values =
        {

            left:
                Math.abs(
                    x
                    -
                    barLeft
                    *
                    rect.width
                ),

            middle:
                Math.abs(
                    x
                    -
                    barMiddle
                    *
                    rect.width
                ),

            right:
                Math.abs(
                    x
                    -
                    barRight
                    *
                    rect.width
                )

        };


    return Object
        .entries(values)
        .sort(
            function(a, b) {

                return a[1] - b[1];

            }
        )[0][0];

}


function moveBar(clientX) {

    if (
        dragging === null
    ) {

        return;

    }


    const track =
        document.querySelector(
            ".bar-track"
        );


    const rect =
        track.getBoundingClientRect();


    let x =
        (
            clientX
            -
            rect.left
        )
        /
        rect.width;


    x =
        Math.max(
            0.02,
            Math.min(
                0.98,
                x
            )
        );


    const minimum =
        minimumBarWidth();


    if (
        dragging ===
        "left"
    ) {

        barLeft =
            Math.max(
                0.02,
                Math.min(
                    x,
                    barMiddle
                    -
                    minimum
                )
            );

    }


    else if (
        dragging ===
        "middle"
    ) {

        barMiddle =
            Math.max(
                barLeft
                +
                minimum,

                Math.min(
                    x,
                    barRight
                    -
                    minimum
                )
            );

    }


    else if (
        dragging ===
        "right"
    ) {

        barRight =
            Math.min(
                0.98,

                Math.max(
                    x,
                    barMiddle
                    +
                    minimum
                )
            );

    }


    drawBar();

}


barArea.addEventListener(
    "pointerdown",
    function(event) {

        dragging =
            nearestHandle(
                event.clientX
            );


        try {

            barArea.setPointerCapture(
                event.pointerId
            );

        }

        catch (error) {}


        moveBar(
            event.clientX
        );


        event.preventDefault();

    }
);


barArea.addEventListener(
    "pointermove",
    function(event) {

        if (
            dragging === null
        ) {

            return;

        }


        moveBar(
            event.clientX
        );


        event.preventDefault();

    }
);


barArea.addEventListener(
    "pointerup",
    function() {

        dragging = null;

    }
);


barArea.addEventListener(
    "pointercancel",
    function() {

        dragging = null;

    }
);


window.addEventListener(
    "resize",
    drawBar
);


// ============================================================
// 音声処理
// ============================================================

let audioContext = null;
let mediaStream = null;

let sourceNode = null;
let processorNode = null;
let muteNode = null;

let sampleQueue = [];
let queueOffset = 0;

let frameSize = 735;

let calibrationFramesNeeded = 60;
let releaseFramesNeeded = 17;

let calibrating = false;
let calibrationVolumes = [];

let noiseFloor = 0;

let normalDynamicMin =
    NORMAL_MIN_VOLUME;

let weakDynamicMin =
    WEAK_MIN_VOLUME;

let normalCount = 0;
let weakCount = 0;

let soundLatched = false;

let releaseCount = 0;


// ============================================================
// RMS
// ============================================================

function calculateRMS(samples) {

    let total = 0;


    for (
        let i = 0;
        i < samples.length;
        i++
    ) {

        total +=
            samples[i]
            *
            samples[i];

    }


    return Math.sqrt(
        total
        /
        samples.length
    );

}


// ============================================================
// Peak
// ============================================================

function calculatePeak(samples) {

    let peak = 0;


    for (
        const value
        of samples
    ) {

        const absolute =
            Math.abs(
                value
            );


        if (
            absolute > peak
        ) {

            peak = absolute;

        }

    }


    return peak;

}


// ============================================================
// ZCR
// ============================================================

function calculateZCR(samples) {

    let count = 0;


    for (
        let i = 1;
        i < samples.length;
        i++
    ) {

        const before =
            samples[i - 1];


        const now =
            samples[i];


        if (
            (
                before < 0
                &&
                now >= 0
            )
            ||
            (
                before >= 0
                &&
                now < 0
            )
        ) {

            count++;

        }

    }


    return (
        count
        /
        samples.length
    );

}


// ============================================================
// FFT
// ============================================================

function nextPowerOfTwo(number) {

    let value = 1;


    while (
        value < number
    ) {

        value *= 2;

    }


    return value;

}


function fftMagnitudes(samples) {

    const size =
        nextPowerOfTwo(
            samples.length
        );


    const real =
        new Float64Array(
            size
        );


    const imaginary =
        new Float64Array(
            size
        );


    for (
        let i = 0;
        i < samples.length;
        i++
    ) {

        real[i] =
            samples[i];

    }


    let j = 0;


    for (
        let i = 1;
        i < size;
        i++
    ) {

        let bit =
            size >> 1;


        while (
            j & bit
        ) {

            j ^= bit;
            bit >>= 1;

        }


        j ^= bit;


        if (
            i < j
        ) {

            const tempReal =
                real[i];


            real[i] =
                real[j];


            real[j] =
                tempReal;


            const tempImag =
                imaginary[i];


            imaginary[i] =
                imaginary[j];


            imaginary[j] =
                tempImag;

        }

    }


    for (
        let length = 2;
        length <= size;
        length *= 2
    ) {

        const angle =
            -2
            *
            Math.PI
            /
            length;


        const baseCos =
            Math.cos(
                angle
            );


        const baseSin =
            Math.sin(
                angle
            );


        for (
            let i = 0;
            i < size;
            i += length
        ) {

            let wCos = 1;
            let wSin = 0;


            for (
                let k = 0;
                k < length / 2;
                k++
            ) {

                const firstReal =
                    real[i + k];


                const firstImag =
                    imaginary[i + k];


                const index2 =
                    i
                    +
                    k
                    +
                    length / 2;


                const secondReal =
                    real[index2]
                    *
                    wCos
                    -
                    imaginary[index2]
                    *
                    wSin;


                const secondImag =
                    real[index2]
                    *
                    wSin
                    +
                    imaginary[index2]
                    *
                    wCos;


                real[i + k] =
                    firstReal
                    +
                    secondReal;


                imaginary[i + k] =
                    firstImag
                    +
                    secondImag;


                real[index2] =
                    firstReal
                    -
                    secondReal;


                imaginary[index2] =
                    firstImag
                    -
                    secondImag;


                const nextCos =
                    wCos
                    *
                    baseCos
                    -
                    wSin
                    *
                    baseSin;


                const nextSin =
                    wCos
                    *
                    baseSin
                    +
                    wSin
                    *
                    baseCos;


                wCos =
                    nextCos;


                wSin =
                    nextSin;

            }

        }

    }


    const magnitudes =
        new Float64Array(
            size / 2 + 1
        );


    for (
        let i = 0;
        i < magnitudes.length;
        i++
    ) {

        magnitudes[i] =
            Math.hypot(
                real[i],
                imaginary[i]
            );

    }


    return {

        magnitudes:
            magnitudes,

        fftSize:
            size

    };

}


// ============================================================
// 音分析
// ============================================================

function analyzeFrame(samples) {

    const volume =
        calculateRMS(
            samples
        );


    const peak =
        calculatePeak(
            samples
        );


    const zcr =
        calculateZCR(
            samples
        );


    const fft =
        fftMagnitudes(
            samples
        );


    let total = 0;
    let high = 0;


    for (
        let i = 0;
        i < fft.magnitudes.length;
        i++
    ) {

        const magnitude =
            fft.magnitudes[i];


        total +=
            magnitude;


        const frequency =
            i
            *
            audioContext.sampleRate
            /
            fft.fftSize;


        if (
            frequency >= 3000
        ) {

            high +=
                magnitude;

        }

    }


    const highRatio =
        total > 0
        ?
        high / total
        :
        0;


    return {

        volume:
            volume,

        peak:
            peak,

        zcr:
            zcr,

        highRatio:
            highRatio

    };

}


// ============================================================
// S開始条件
// ============================================================

function commonSFeatures(result) {

    if (
        result.highRatio <
        HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr <
        ZCR_MIN
    ) {

        return false;

    }


    const peakRatio =
        result.volume > 0
        ?
        result.peak
        /
        result.volume
        :
        999;


    if (
        peakRatio >
        PEAK_RATIO_LIMIT
    ) {

        return false;

    }


    if (
        result.peak >
        PEAK_LIMIT
    ) {

        return false;

    }


    return true;

}


function normalS(result) {

    if (
        result.volume <
        normalDynamicMin
    ) {

        return false;

    }


    return commonSFeatures(
        result
    );

}


function weakS(result) {

    if (
        result.volume <
        weakDynamicMin
    ) {

        return false;

    }


    return commonSFeatures(
        result
    );

}


// ============================================================
// S継続条件
//
// 開始後だけ少し緩くする。
// Androidの持続Sに強くする。
// ============================================================

function holdS(result) {

    /*
        無音付近まで下がった場合は
        S継続とはしない。
    */

    const minimumVolume =
        Math.max(

            WEAK_MIN_VOLUME
            *
            0.70,

            noiseFloor
            *
            RELEASE_NOISE_MULTIPLIER,

            noiseFloor
            +
            RELEASE_NOISE_ADD

        );


    if (
        result.volume <
        minimumVolume
    ) {

        return false;

    }


    if (
        result.highRatio <
        HOLD_HIGH_RATIO_MIN
    ) {

        return false;

    }


    if (
        result.zcr <
        HOLD_ZCR_MIN
    ) {

        return false;

    }


    const peakRatio =
        result.volume > 0
        ?
        result.peak
        /
        result.volume
        :
        999;


    /*
        継続中だけ若干ゆるくする。
        リップノイズのような一瞬の衝撃音は
        それでも除外する。
    */

    if (
        peakRatio > 6.0
    ) {

        return false;

    }


    if (
        result.peak > 0.11
    ) {

        return false;

    }


    return true;

}


// ============================================================
// キャリブレーション
// ============================================================

function finishCalibration() {

    const values =
        [
            ...calibrationVolumes
        ].sort(
            function(a, b) {

                return a - b;

            }
        );


    if (
        values.length > 0
    ) {

        noiseFloor =
            values[
                Math.floor(
                    values.length / 2
                )
            ];

    }

    else {

        noiseFloor = 0;

    }


    normalDynamicMin =
        Math.max(

            NORMAL_MIN_VOLUME,

            noiseFloor
            *
            1.35,

            noiseFloor
            +
            0.0015

        );


    normalDynamicMin =
        Math.min(
            normalDynamicMin,
            0.0100
        );


    weakDynamicMin =
        Math.max(

            WEAK_MIN_VOLUME,

            noiseFloor
            *
            1.12,

            noiseFloor
            +
            0.0005

        );


    weakDynamicMin =
        Math.max(
            weakDynamicMin,

            noiseFloor
            +
            0.0004
        );


    weakDynamicMin =
        Math.min(
            weakDynamicMin,
            0.0065
        );


    calibrating = false;


    statusElement.textContent =
        "";

}


// ============================================================
// 判定
// ============================================================

function processResult(result) {

    if (
        calibrating
    ) {

        calibrationVolumes.push(
            result.volume
        );


        if (
            calibrationVolumes.length >=
            calibrationFramesNeeded
        ) {

            finishCalibration();

        }


        return;

    }


    /*
        ======================================================
        画像がまだ出ていない
        ======================================================
    */

    if (
        !soundLatched
    ) {

        const normalCandidate =
            normalS(
                result
            );


        const weakCandidate =
            weakS(
                result
            );


        if (
            normalCandidate
        ) {

            normalCount++;

        }

        else {

            normalCount = 0;

        }


        if (
            weakCandidate
        ) {

            weakCount++;

        }

        else {

            weakCount = 0;

        }


        const normalSuccess =
            normalCount >=
            NORMAL_REQUIRED;


        const weakSuccess =
            weakCount >=
            WEAK_REQUIRED;


        if (
            normalSuccess
            ||
            weakSuccess
        ) {

            soundLatched = true;

            releaseCount = 0;

            showRandomMainImage();

        }


        return;

    }


    /*
        ======================================================
        画像表示中
        ======================================================

        ここでは開始時より少し緩いholdSを使う。

        Androidで一瞬だけS特徴が弱くなっても、
        すぐには画像を消さない。
    */

    const continuing =
        holdS(
            result
        );


    if (
        continuing
    ) {

        releaseCount = 0;

        return;

    }


    releaseCount++;


    /*
        約0.28秒連続して
        S継続条件を満たさなくなったら終了。
    */

    if (
        releaseCount >=
        releaseFramesNeeded
    ) {

        soundLatched = false;

        normalCount = 0;
        weakCount = 0;

        releaseCount = 0;

        clearImageElement(
            mainImage
        );

    }

}


// ============================================================
// 音声フレーム
// ============================================================

function addSamples(input) {

    for (
        let i = 0;
        i < input.length;
        i++
    ) {

        sampleQueue.push(
            input[i]
        );

    }


    while (
        sampleQueue.length
        -
        queueOffset
        >=
        frameSize
    ) {

        const frame =
            new Float32Array(
                frameSize
            );


        for (
            let i = 0;
            i < frameSize;
            i++
        ) {

            frame[i] =
                sampleQueue[
                    queueOffset + i
                ];

        }


        queueOffset +=
            frameSize;


        const result =
            analyzeFrame(
                frame
            );


        processResult(
            result
        );

    }


    if (
        queueOffset > 8192
    ) {

        sampleQueue =
            sampleQueue.slice(
                queueOffset
            );


        queueOffset = 0;

    }

}


// ============================================================
// マイク停止
// ============================================================

function stopExistingMicrophone() {

    try {

        if (
            processorNode
        ) {

            processorNode.onaudioprocess =
                null;


            processorNode.disconnect();


            processorNode = null;

        }

    }

    catch (error) {}


    try {

        if (
            sourceNode
        ) {

            sourceNode.disconnect();


            sourceNode = null;

        }

    }

    catch (error) {}


    try {

        if (
            muteNode
        ) {

            muteNode.disconnect();


            muteNode = null;

        }

    }

    catch (error) {}


    try {

        if (
            mediaStream
        ) {

            mediaStream
                .getTracks()
                .forEach(
                    function(track) {

                        track.stop();

                    }
                );


            mediaStream = null;

        }

    }

    catch (error) {}


    try {

        if (
            audioContext
        ) {

            audioContext.close();


            audioContext = null;

        }

    }

    catch (error) {}

}


// ============================================================
// マイク開始
// ============================================================

async function startMicrophone() {

    if (
        !window.isSecureContext
    ) {

        alert(
            "HTTPS接続ではないためマイクを使用できません。"
        );


        return;

    }


    if (
        !navigator.mediaDevices
        ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "このブラウザではマイク機能を利用できません。"
        );


        return;

    }


    stopExistingMicrophone();


    statusElement.textContent =
        "ちょっとだけ　しずかにしてね…";


    clearImageElement(
        mainImage
    );


    normalCount = 0;
    weakCount = 0;

    releaseCount = 0;

    soundLatched = false;

    calibrationVolumes = [];

    calibrating = true;

    normalDynamicMin =
        NORMAL_MIN_VOLUME;

    weakDynamicMin =
        WEAK_MIN_VOLUME;


    try {

        /*
            まずシンプルな条件でマイク取得。

            PC / iPad / Androidで
            最も互換性を優先。
        */

        mediaStream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    {
                        audio: true,
                        video: false
                    }
                );


        const AudioContextClass =
            window.AudioContext
            ||
            window.webkitAudioContext;


        audioContext =
            new AudioContextClass();


        if (
            audioContext.state ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        frameSize =
            Math.max(
                256,

                Math.round(
                    audioContext.sampleRate
                    *
                    (
                        735
                        /
                        44100
                    )
                )
            );


        calibrationFramesNeeded =
            Math.max(
                1,

                Math.round(
                    CALIBRATION_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        releaseFramesNeeded =
            Math.max(
                1,

                Math.round(
                    S_RELEASE_SECONDS
                    *
                    audioContext.sampleRate
                    /
                    frameSize
                )
            );


        sampleQueue = [];
        queueOffset = 0;


        sourceNode =
            audioContext
                .createMediaStreamSource(
                    mediaStream
                );


        processorNode =
            audioContext
                .createScriptProcessor(
                    1024,
                    1,
                    1
                );


        processorNode.onaudioprocess =
            function(event) {

                const input =
                    event
                        .inputBuffer
                        .getChannelData(
                            0
                        );


                addSamples(
                    input
                );

            };


        /*
            Androidを含め、
            音声処理グラフが動き続けるように
            destinationまで接続する。

            gain=0なので音はスピーカーに出ない。
        */

        muteNode =
            audioContext
                .createGain();


        muteNode.gain.value = 0;


        sourceNode.connect(
            processorNode
        );


        processorNode.connect(
            muteNode
        );


        muteNode.connect(
            audioContext.destination
        );


        startButton.disabled = true;


        startButton.textContent =
            "マイク使用中";

    }

    catch (error) {

        console.error(
            error
        );


        statusElement.textContent =
            "";


        startButton.disabled = false;


        startButton.textContent =
            "スタート";


        alert(
            "マイクを開始できませんでした。"
        );

    }

}


// ============================================================
// スタート
// ============================================================

startButton.addEventListener(
    "click",
    startMicrophone
);


// ============================================================
// 起動
// ============================================================

async function initialize() {

    try {

        await openDatabase();

        await reloadImages();

        clearImageElement(
            mainImage
        );

        showWordImage();

        drawBar();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "画像保存機能を開始できませんでした。"
        );

    }

}


initialize();
